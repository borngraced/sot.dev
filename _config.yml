title:  Samuel Onoja # name of the site
author: Samuel Onoja # name of site's author
email: 0@sot.dev # email of site's author
url: https://sot.dev # root address of the site
baseurl: ""
description: Samuel Onoja - Rust software engineer.

twitter:
  card: summary_large_image

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics
google_analytics: "G-QPR7VD5RK7" # GA4 Measurement ID

remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: true # lowercase titles in menu

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
